version: 2

models:
  - name: customer_orders
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_name
        tests: [not_null]
      - name: n_orders
        tests: [not_null]
      - name: total_amount
        tests: [not_null]
      - name: first_order_date
        tests: [not_null]
      - name: most_recent_order_date
        tests: [not_null]
